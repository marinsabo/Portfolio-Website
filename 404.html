<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Marin Sabo</title>
  <meta name="robots" content="noindex">
  <script>
    // Old case-study URLs (incl. the former /en/ versions) moved to /work/.
    (function () {
      var m = location.pathname.match(/^\/(?:en\/)?(vukovarski-golubici|gamechanger|wavelance|codehustling|ikarus)-case-study(?:\.html)?$/);
      if (m) { location.replace('/work/' + m[1] + '.html'); return; }
      if (/^\/en\/?(index\.html)?$/.test(location.pathname)) location.replace('/');
    })();
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script data-goatcounter="https://marinsabo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>

<body>
  <main class="notfound">
    <div class="wrap">
      <p class="eyebrow">Error 404</p>
      <h1>This page doesn’t exist.</h1>
      <div class="console">
        <pre class="console-screen"> <span class="red">IEF212I</span> DATA SET NOT FOUND

 The page you requested isn’t here. It may have
 moved when this site was rebuilt.

 COMMAND ===> <span class="cursor"> </span></pre>
      </div>
      <p class="actions"><a class="btn btn-primary" href="/">Go to the homepage <span class="arr" aria-hidden="true">→</span></a></p>
    </div>
  </main>
</body>

</html>
